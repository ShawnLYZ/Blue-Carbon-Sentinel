# Parameter bounds, rules-tier defaults, intervention effects and cohort settings
# (product spec section 19). PROVISIONAL.
horizon: { start_year: 2026, end_year: 2035 }
bounds:                      # [low, high], per year unless noted
  g: [0.0, 0.15]             # natural regrowth rate
  m: [0.0, 0.40]             # stress mortality rate
  h_rec: [0.0, 0.5]          # health recovery rate
  h_dec: [0.0, 0.5]          # health decline rate
  e: [0.0, 0.05]             # erosion (0.05 ~ 5 m/yr retreat across a 100 m zone)
  stress_trend: [-0.05, 0.10]   # "without" scenario trend in sigma per year
  survival: [0.3, 0.9]       # sapling survival by species
rules_defaults:              # PROVISIONAL; low = pessimistic, high = optimistic (bands come out outcome-ordered)
  g: { central: 0.06, low: 0.03, high: 0.09 }
  m: { central: 0.20, low: 0.30, high: 0.10 }
  h_rec: { central: 0.25, low: 0.15, high: 0.35 }
  h_dec: { central: 0.25, low: 0.35, high: 0.15 }
  e: { central: 0.02, low: 0.03, high: 0.01 }
  trend: { central: 0.03, low: 0.06, high: 0.00 }
  survival_rhizophora: { central: 0.60, low: 0.45, high: 0.75 }
  survival_avicennia: { central: 0.65, low: 0.50, high: 0.80 }
  tau_rhizophora: { central: 6, low: 7, high: 5 }
  tau_avicennia: { central: 5, low: 6, high: 4 }
  factor_silt_fence: { central: 0.4, low: 0.6, high: 0.2 }
  factor_reopen_channel: { central: 0.5, low: 0.75, high: 0.25 }
  factor_stop_pollution: { central: 0.3, low: 0.45, high: 0.15 }
intervention_effects:        # stress multipliers; the AI may adjust within +/-50 %
  adjust_fraction: 0.5
  silt_fence: { turbidity: 0.4 }
  reopen_channel: { porewater_salinity: 0.5, do: 0.5 }
  stop_pollution: { do: 0.3, ph: 0.3 }
cohorts:
  planting_density_per_ha: 4400     # about 1.5 m spacing
  time_constant_yr:                 # logistic canopy growth [low, high]
    plant_rhizophora: [5, 7]
    plant_avicennia: [4, 6]
  avicennia_preferred_porewater_psu_above: 40
uncertainty:
  runs: [low, central, high]
