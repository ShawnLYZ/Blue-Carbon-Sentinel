; SentinelCam firmware (addendum L1). Paths contain spaces on the dev machine: use scripts/fw.ps1 if pio fails.
[platformio]
default_envs = sentinelcam

[env:sentinelcam]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DBCS_FW_VERSION=\"0.2.0\"
lib_deps =
    tzapu/WiFiManager@2.0.17
; Build-time secrets (L7): pre = defines BCS_CAMERA_TOKEN/BCS_CAMERA_OTA_PASSWORD; post = espota --auth.
extra_scripts =
    pre:scripts/inject_secrets.py
    post:scripts/inject_secrets.py

[env:sentinelcam-ota]
extends = env:sentinelcam
upload_protocol = espota
upload_port = sentinel-cam.local

[env:native]
platform = native
test_build_src = no
lib_compat_mode = off
