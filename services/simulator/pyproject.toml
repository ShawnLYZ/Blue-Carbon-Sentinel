[project]
name = "bcs-sim"
version = "0.1.0"
description = "Blue Carbon Sentinel Simulator"
requires-python = "==3.12.*"
dependencies = [
    "bcs-protocol",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "numpy>=2.3,<3",
    "paho-mqtt>=2.1,<3",
    "websockets>=15",
]

[project.scripts]
bcs-sim = "bcs_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcs_sim"]
