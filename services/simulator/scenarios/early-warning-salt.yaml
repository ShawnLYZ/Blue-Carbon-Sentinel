# Salt intrusion creeping over SP-02's zones (E3, E4; B2-B4 reach no SP-02 in the default layout): porewater
# salinity climbs (tau 180 s) before the surface water shows much, which is what the early-warning story needs.
# Early warning also needs a measured vegetation stressor (a camera baseline and a capture of the zone).
name: early-warning-salt
seed: 7
duration_s: 600
demo_time_scale: true
fast_forward: 1
nodes: {}
steps:
  - {at_s: 0,   action: apply_scenario, zone: E3, scenario: salt_intrusion, ramp_s: 180}
  - {at_s: 0,   action: apply_scenario, zone: E4, scenario: salt_intrusion, ramp_s: 180}
  # Hold SP-02's porewater at 58 PSU from 240 s: stress 0.54 (breakpoints 40 -> 0, 60 -> 0.6) is above the 0.5
  # early-warning composite yet below SP-02's 60 PSU critical band. Salt on E3 + E4 alone would carry SP-02 past
  # 60 PSU at about 330 s (a threshold anomaly racing the early warning), so the hold must start before that;
  # a drift override would decay back to that natural value within a minute.
  - {at_s: 240, action: set_value,      node: SP-02, parameter: porewater_salinity_psu, value: 58, behaviour: hold}
  - {at_s: 480, action: apply_scenario, zone: E3, scenario: recovery}
  - {at_s: 480, action: apply_scenario, zone: E4, scenario: recovery}
  - {at_s: 540, action: clear_value,    node: SP-02}
