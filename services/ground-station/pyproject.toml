[project]
name = "bcs-gs"
version = "0.1.0"
description = "Blue Carbon Sentinel Ground Station"
requires-python = "==3.12.*"
dependencies = [
    "bcs-protocol",
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.12,<5",
    "onnxruntime-directml==1.24.*; sys_platform == 'win32'",
    "onnxruntime>=1.24; sys_platform != 'win32'",
    "paho-mqtt>=2.1,<3",
    "google-genai>=2.28,<3",
    "supabase>=2.32,<3",
    "fpdf2>=2.8.9",
    "matplotlib>=3.11",
    "zeroconf>=0.151",
    "psutil>=7.2.2",
]

[project.scripts]
bcs-gs = "bcs_gs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcs_gs"]
